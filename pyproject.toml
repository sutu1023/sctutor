[project]
name = "sctutor"
version = "0.1.0"
description = "本地课程课件引导式辅导 MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "python-dotenv>=1,<2",
  "rank-bm25>=0.2.2,<1",
  "numpy>=2,<3",
  "defusedxml>=0.7,<1",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "websockets>=14,<18"]

[project.scripts]
sctutor = "sctutor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
